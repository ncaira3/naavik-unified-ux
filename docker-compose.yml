version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: naavik_postgres
    environment:
      POSTGRES_DB: naavik_demo
      POSTGRES_USER: naavik_user
      POSTGRES_PASSWORD: naavik_pass_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naavik_user -d naavik_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - naavik_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: naavik_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@naavik.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - naavik_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  naavik_network:
    driver: bridge
